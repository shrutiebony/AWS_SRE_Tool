[project]
name = "sre-agent"
version = "0.1.0"
description = "Discover existing AWS resources, monitor them, diagnose failures, and run gated repairs."
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.scripts]
sre-agent = "sre_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
